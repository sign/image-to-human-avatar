[build-system]
# setuptools>=77 for the PEP 639 SPDX `license` expression; it also auto-detects and
# bundles LICENSE, so no explicit `license-files` entry is needed
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-human-avatar"
description = "Process photos of humans into animatable human avatars."
version = "0.2.4"
authors = [
    { name = "Amit Moryossef", email = "amitmoryossef@gmail.com" },
]
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.10"
dependencies = [
    # base install supports cropping only (crop_image): image IO + pose detection for shoulders.
    # the avatar masking/pose stack (torch, transformers, ...) lives in the optional [mask] extra.
    "Pillow",
    # crop_image uses the legacy mp.solutions.pose API, removed in mediapipe 0.10.30
    "mediapipe<0.10.30",
]

[project.urls]
Homepage = "https://github.com/sign/image-to-human-avatar"
Repository = "https://github.com/sign/image-to-human-avatar"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

# full avatar pipeline (image_to_avatar): background masking (RMBG) + full-body pose extraction.
# not needed just to crop, so kept out of the base install.
mask = [
    # Transformers with vision
    "transformers",
    "torchvision",
    "scikit-image",
    # Required by briaai/RMBG-2.0 trust_remote_code modeling file
    "kornia",
    "timm",
    # full-body holistic pose extraction
    "pose-format",
]

server = [
    "image-to-human-avatar[mask]",
    "Flask",
    "Werkzeug",
    "gunicorn",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "C90", # mccabe complexity
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "PT", # flake8-pytest-style
    "W605", # invalid escape sequence
    "BLE", # flake8-blind-except
]

[tool.setuptools]
packages = [
    "human_avatar"
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["human_avatar"]
